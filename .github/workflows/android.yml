name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download offline Russian speech model
        run: |
          curl -fL --retry 3 -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q /tmp/model.zip -d /tmp
          mkdir -p app/src/main/assets/model-ru
          cp -a /tmp/vosk-model-small-ru-0.22/. app/src/main/assets/model-ru/
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Moydodyr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
